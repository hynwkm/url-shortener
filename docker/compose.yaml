# docker compose file

services:
  was:
    build:
      context: ./Tomcat
      dockerfile: dockerfile
    image: tomcatwas
    restart: always #unless-stopped

    depends_on: 
      - db
    
    ports:
      - "8080:8080"  # ec2의 아이피 지정해서 연결?
    
    environment:
      #시간대설정- 동기화
      TZ: Asia/Seoul
      #mariaDB 연결 정보
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      #DB이름, 접속포트, 마리아DB 계정
      BASE_URL: ${BASE_URL} # (WAR 파일 안의 Java 코드가 해당 값을 읽어서 단축 URL을 동적으로 생성)
    
    secrets:
      #mariaDB 연결 패스워드
      - mariadb_app_password
    networks:
      - #was와 DB를 연결할 도커 네트워크




